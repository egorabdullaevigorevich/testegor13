<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNext — Новая эра облачных экосистем</title>
    <!-- Иконки и шрифт премиум-класса -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1; /* Индиго неон */
            --accent: #22d3ee;  /* Кислотный циан */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Декоративные размытые неоновые сферы на фоне */
        .glow-sphere {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }
        .sphere-1 { top: -100px; right: -100px; }
        .sphere-2 { top: 600px; left: -200px; background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, rgba(0,0,0,0) 70%); }

        /* Навигационная панель (Стеклянный эффект) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: var(--primary);
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s, transform 0.2s;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            padding: 0.7rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
        }

        /* Главный экран (Hero) */
        .hero {
            padding: 11rem 8% 7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            max-width: 900px;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom, #ffffff 40%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h1 span {
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 650px;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        .hero-actions {
            display: flex;
            gap: 1.2rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
        }

        /* Секция контента / Сетка */
        .section {
            padding: 7rem 8%;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* Карточки премиум-вида с подсветкой при наведении */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(99,102,241,0.05) 0%, rgba(0,0,0,0) 50%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .card:hover .card-icon {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.3px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.7;
        }

        /* Интерактивные Тарифы (Добавлено для крутизны) */
        .pricing-card {
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .pricing-card.popular {
            border-color: var(--primary);
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.08) 0%, rgba(17, 24, 39, 0.7) 100%);
        }

        .price {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin: 1.5rem 0 0.5rem;
        }
        
        .price span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Подвал */
        footer {
            border-top: 1px solid var(--border);
            padding: 3rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: #020613;
        }

        .socials {
            display: flex;
            gap: 1.5rem;
        }

        .socials a {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .socials a:hover {
            color: var(--accent);
        }

        /* Адаптивный дизайн */
        @media (max-width: 968px) {
            .hero h1 { font-size: 2.8rem; }
            header { padding: 1.2rem 5%; }
            .section { padding: 5rem 5%; }
            footer { flex-direction: column; gap: 1.5rem; text-align: center; }
        }
